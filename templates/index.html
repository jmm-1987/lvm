<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página de inicio</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
        }
        .main-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            padding: 48px 40px 36px 40px;
            text-align: center;
            min-width: 350px;
            position: relative;
        }
        h1 {
            color: #1976d2;
            margin-bottom: 18px;
        }
        .menu-btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 20px 10px 20px 10px;
            font-size: 1.2em;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background-color: #1565c0;
        }
        .informes-block {
            margin-top: 40px;
            padding: 28px 0 10px 0;
            border-top: 2px solid #e3eaf2;
        }
        .informes-title {
            color: #333;
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Bienvenido a la gestión contable</h1>
        <a href="/cuentas" class="menu-btn">Gestión de cuentas</a>
        <a href="/movimientos" class="menu-btn">Gestión de movimientos</a>
        {% if current_user.is_authenticated %}
            <form action="{{ url_for('logout') }}" method="post" style="position:absolute; top:0; right:0;">
                <button type="submit" class="logout-btn">Cerrar sesión</button>
            </form>
        {% endif %}
        <div class="informes-block">
            <div class="informes-title">Informes</div>
            <a href="/resultado_explotacion" class="menu-btn" style="background:#388e3c;">Resultado de explotación</a>
            <a href="/iva" class="menu-btn" style="background:#fbc02d; color:#333;">303 IVA</a>
            <a href="/retencion_alquileres" class="menu-btn" style="background:#8e24aa; color:#fff;">115 retención alquileres</a>
            <a href="/retencion_empleados" class="menu-btn" style="background:#8d6e63; color:#fff;">111 retenciones empleados</a>
            <a href="/347" class="menu-btn" style="background:#b0bec5; color:#333;">347</a>
        </div>
    </div>
</body>
</html>
