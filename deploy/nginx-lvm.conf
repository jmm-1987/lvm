# Configuración Nginx para LVM
# Copiar a: /etc/nginx/sites-available/lvm
# Activar: sudo ln -s /etc/nginx/sites-available/lvm /etc/nginx/sites-enabled/
# Reemplaza TU_DOMINIO_O_IP por tu dominio o IP del VPS

server {
    listen 80;
    server_name TU_DOMINIO_O_IP;

    # Redirigir HTTP a HTTPS (descomenta cuando tengas SSL)
    # return 301 https://$server_name$request_uri;
    # }

    # server {
    # listen 443 ssl http2;
    # server_name TU_DOMINIO_O_IP;
    # ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
